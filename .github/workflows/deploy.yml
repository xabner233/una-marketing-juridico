name: Deploy HostGator
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cada pasta do repositório vira um site em lrsocialmedia.com.br/portfolio/<pasta>
# (a conta FTP já aponta para public_html/portfolio)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .nojekyll
            README.md
